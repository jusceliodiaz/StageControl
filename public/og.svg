  <text x="572" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0d0d0d" text-anchor="middle">S</text>

  <!-- Title -->
  <text x="600" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="600" fill="white" text-anchor="middle" letter-spacing="-1">Stage</text>

