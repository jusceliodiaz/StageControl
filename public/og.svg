  <line x1="0" y1="210" x2="1200" y2="210" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="white" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Monitor icons -->
  <rect x="220" y="200" width="180" height="120" rx="10" fill="none" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>
  <rect x="240" y="215" width="140" height="88" rx="4" fill="white" fill-opacity="0.04"/>
  <rect x="290" y="323" width="40" height="8" rx="4" fill="white" fill-opacity="0.1"/>

  <rect x="510" y="180" width="180" height="120" rx="10" fill="none" stroke="white" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="530" y="195" width="140" height="88" rx="4" fill="white" fill-opacity="0.07"/>
  <rect x="580" y="303" width="40" height="8" rx="4" fill="white" fill-opacity="0.15"/>

